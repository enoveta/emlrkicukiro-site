# /etc/nginx/sites-available/site.emlrkicukiroparish.org  (after certbot certonly --webroot)
server {
    listen 80;
    listen [::]:80;
    server_name site.emlrkicukiroparish.org;
    location ^~ /.well-known/acme-challenge/ { root /var/www/site.emlrkicukiroparish.org/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name site.emlrkicukiroparish.org;

    ssl_certificate     /etc/letsencrypt/live/site.emlrkicukiroparish.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/site.emlrkicukiroparish.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/snippets/emlr-site-common.conf;
}
