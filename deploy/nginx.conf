# /etc/nginx/sites-available/emlr  →  ln -s to sites-enabled, then: nginx -t && systemctl reload nginx
# Replace emlrkicukiro.rw with the real domain. SSL is added by: certbot --nginx -d emlrkicukiro.rw -d www.emlrkicukiro.rw

upstream emlr_api {
    server 127.0.0.1:5050;
    keepalive 16;
}

server {
    listen 80;
    server_name emlrkicukiro.rw www.emlrkicukiro.rw;

    root /var/www/emlr/build;
    index index.html;

    client_max_body_size 45m;   # dashboard uploads (videos up to 40 MB)

    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Photos and videos: served straight from disk, so they keep working even if the API is down.
    location /media/ {
        alias /var/www/emlr/Backend/public/media/;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri @api;   # old /media/news etc. links → API redirects them
    }

    location /api/ {
        proxy_pass http://emlr_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location @api {
        proxy_pass http://emlr_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /health { proxy_pass http://emlr_api; }

    # Hashed build files never change → cache for a year.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The service worker and index.html must always be fresh so updates reach visitors.
    location = /service-worker.js { add_header Cache-Control "no-cache"; }
    location = /index.html        { add_header Cache-Control "no-cache"; }

    # Single-page app: every other path loads index.html.
    location / {
        try_files $uri /index.html;
    }
}
